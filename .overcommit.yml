# Local hooks must be fast, deterministic, and independent of Docker and PostgreSQL.
# The full suite, RuboCop, Brakeman, BundlerAudit, and I18n run in GitHub Actions.
gemfile: Gemfile

PreCommit:
  TrailingWhitespace:
    enabled: true

PrePush:
  BundleCheck:
    enabled: false

  Brakeman:
    enabled: false

  BundlerAudit:
    enabled: false

  RSpec:
    enabled: false
