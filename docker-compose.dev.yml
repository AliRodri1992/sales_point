services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
      args:
        INSTALL_TEST_BROWSER: "true"

    container_name: rails_sale_point

    # Keep Rails online even if a watcher or worker fails in its own service.
    init: true
    restart: unless-stopped
    stop_grace_period: 15s

    env_file:
      - .env.development

    volumes:
      - .:/rails
      - /rails/node_modules
      - bundle_cache:/bundle

    ports:
      - "3000:3000"

    stdin_open: true
    tty: true

    depends_on:
    
  assets:
    build:
      context: .
      dockerfile: Dockerfile.dev
      args:
        INSTALL_TEST_BROWSER: "true"

    init: true
    restart: unless-stopped
    stop_grace_period: 15s

    env_file:
      - .env.development

    volumes:
      - .:/rails
      - /rails/node_modules
      - bundle_cache:/bundle

    # Foreman manages only the asset watchers; Puma is independent.
    command: bundle exec foreman start -f Procfile.assets.dev --env /dev/null

  db:
        condition: service_healthy
      redis:
        condition: service_started

    environment:
      REDIS_URL: redis://redis:6379/0
      CHROME_BINARY: /usr/bin/chromium
      CHROMEDRIVER_PATH: /usr/bin/chromedriver

    # Assets are watched by a separate service so their failures cannot stop Puma.
    command: bash -lc "bin/rails db:prepare && exec bin/rails server -b 0.0.0.0 -p 3000"

  db:
    image: postgres:16
    container_name: postgres_sale_point
    restart: unless-stopped

    environment:
      POSTGRES_DB: sale_point_development
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - pgdata:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.2.6-alpine
    container_name: redis_sale_point
    restart: unless-stopped

    ports:
      - "6379:6379"

    command: redis-server --appendonly yes

    volumes:
      - redisdata:/data

  sidekiq:
    build:
      context: .
      dockerfile: Dockerfile.dev

    container_name: sidekiq_sale_point

    init: true
    restart: unless-stopped
    stop_grace_period: 15s

    env_file:
      - .env.development

    depends_on:
      - db
      - redis

    environment:
      REDIS_URL: redis://redis:6379/0

    volumes:
      - .:/rails
      - bundle_cache:/bundle

    command: bundle exec sidekiq -C config/sidekiq.yml

volumes:
  pgdata:
  bundle_cache:
  redisdata:
