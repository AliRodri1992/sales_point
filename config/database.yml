<% require 'socket' %><% def database_config_host
  configured_host = ENV['POSTGRES_HOST'] || 'db'
  port = (ENV['POSTGRES_PORT'] || 5432).to_i

  # If Docker postgres responds, use it. Otherwise fall back to the local
  # Postgres of this machine so the app works without the container.
  begin
    Socket.tcp(configured_host, port, connect_timeout: 1).close
    configured_host
  rescue StandardError
    '127.0.0.1'
  end
end %>

default: &default
  adapter: postgresql
  encoding: utf8
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 10} %>
  username: <%= ENV.fetch('POSTGRES_USER') { 'postgres' } %>
  password: <%= ENV.fetch('POSTGRES_PASSWORD') { 'postgres' } %>
  host: <%= database_config_host %>
  port: <%= ENV.fetch('POSTGRES_PORT') { 5432 } %>


development:
  <<: *default
  database: <%= ENV.fetch('POSTGRES_DB') { 'sale_point_development' } %>

test:
  <<: *default
  database: <%= ENV.fetch("POSTGRES_DB_TEST", "sale_point_test") %>

production:
  primary: &primary_production
    <<: *default
    database: <%= ENV.fetch("POSTGRES_DB", "freightspot_production") %>
  cache:
    <<: *primary_production
    database: <%= ENV.fetch("POSTGRES_DB_CACHE", "freightspot_production_cache") %>
    migrations_paths: db/cache_migrate
  queue:
    <<: *primary_production
    database: <%= ENV.fetch("POSTGRES_DB_QUEUE", "freightspot_production_queue") %>
    migrations_paths: db/queue_migrate
  cable:
    <<: *primary_production
    database: <%= ENV.fetch("POSTGRES_DB_CABLE", "freightspot_production_cable") %>
    migrations_paths: db/cable_migrate

staging:
  primary: &primary_staging
    <<: *default
    database: <%= ENV.fetch("POSTGRES_DB", "sale_point_staging") %>
  cache:
    <<: *primary_staging
    database: <%= ENV.fetch("POSTGRES_DB_CACHE", "sale_point_staging_cache") %>
    migrations_paths: db/cache_migrate
  queue:
    <<: *primary_staging
    database: <%= ENV.fetch("POSTGRES_DB_QUEUE", "sale_point_staging_queue") %>
    migrations_paths: db/queue_migrate
  cable:
    <<: *primary_staging
    database: <%= ENV.fetch("POSTGRES_DB_CABLE", "sale_point_staging_cable") %>
    migrations_paths: db/cable_migrate
