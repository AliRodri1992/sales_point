      user_guide: "사용 안내"
      guide_title: "시스템 사용 안내"
      guide_intro: "Delta POS의 주요 기능을 확인하세요. 권한에 따라 사용 가능한 기능이 달라집니다."
      open_module: "모듈 열기"
      active_records: "활성"
      archived_records: "보관됨"
      select_all: "전체 선택"
      bulk_archive: "선택 보관"
      bulk_restore: "선택 복구"
      guide:
        profile:
          title: "프로필 및 설정"
          description: "사용자 메뉴에서 계정 정보를 확인하고 환경설정을 변경하세요."
        suppliers:
          title: "공급업체 목록"
          description: "기본 담당자 한 명과 기본 세무 주소로 공급업체를 등록합니다. 추가 정보는 공급업체 상세 화면에서 관리합니다."
        contacts:
          title: "공급업체 담당자"
          description: "공급업체 상세 화면에서 담당자 등록, 편집, 기본 지정, 보관 및 복원을 수행합니다."
        addresses:
          title: "주소 및 위치"
          description: "국가를 선택하고 주소를 입력한 뒤 지도 위치를 검토하고 확인합니다."
        products:
          title: "상품과 가격"
          description: "상품을 연결하고 가격을 등록하며 제안을 비교합니다. 이용 가능한 공급업체만 우선 지정할 수 있습니다."
        documents:
          title: "문서 보관함"
          description: "파일을 끌어다 놓고 필터링하며 미리보기, 버전 기록 및 복원 기능을 사용합니다."
        schedules:
          title: "일정과 예외"
          description: "지점별 방문, 주문 및 배송 일정을 만들고 날짜별 휴무와 중단을 관리합니다."
        finances:
          title: "미지급금과 재무"
          description: "미지급 잔액을 확인하고 권한에 따라 송장, 지급 및 대변 메모를 등록합니다."
        purchases:
          title: "구매 및 입고"
          description: "구매 요청과 주문을 생성하고 승인을 요청하며 입고와 재고 변동을 확인합니다."
        reports:
          title: "보고서"
          description: "권한이 허용된 보고서를 열고 승인된 데이터만 내보냅니다."
