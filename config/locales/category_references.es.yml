      references:
        action: Reasignar referencias
        in_use: Esta categoría todavía está vinculada a productos o promociones. Usa Reasignar referencias para moverlos antes de retirarla.
        explanation: Mueve los productos y las condiciones de promociones vinculados a otra categoría. Incluye registros inactivos; los retirados conservan sus vínculos históricos.
        retire_after: La categoría original se conserva hasta que la retires. Desactivarla no elimina sus referencias.
        conditions_hint: Las condiciones de promoción usarán la categoría de destino y podrán aplicar a sus productos.
