          one: "%{count} producto"
          other: "%{count} productos"
        conditions:
          one: "%{count} condición de promoción"
          other: "%{count} condiciones de promoción"
        destination: Categoría de destino
        choose: Selecciona una categoría
        destination_hint: Elige otra categoría activa de esta organización.
        no_destinations: Crea o activa otra categoría antes de reasignar las referencias.
        no_references: Esta categoría no tiene referencias vigentes y se puede retirar.
        saving: Reasignando…
        saved: "Referencias reasignadas a %{name}. Ya puedes retirar la categoría original."
        failed: No se cambió ninguna referencia. Un registro vinculado no pasó la validación; revisa sus datos e inténtalo de nuevo.
