ko:
  privacy:
    title: 개인정보 처리방침
    eyebrow: Delta POS · 개인정보
    intro: Delta POS 시연 신청 시 제공한 정보의 이용에 관한 안내입니다.
    version: 버전
    skip: 본문으로 이동
    contents: 목차
    draft_title: 보완이 필요한 초안
    draft_body: 검토용 초안입니다. 최종 안내문으로 사용하기 전에 문의 이메일을 활성화하고 전체 주소, 보관 조건, 서비스 제공업체 및 요청 처리 절차를 확인해야 합니다.
    identity: 개인정보 처리 주체
    address: 주소
    contact: 개인정보 문의
    pending: 입력 예정
    footer: 작성 중인 양식을 유지할 수 있도록 별도 페이지로 열립니다.
    sections:
      responsible:
        title: 개인정보 처리 주체
        body: Delta POS 운영 책임자의 정보를 아래에 기재해야 합니다. 제품 이름은 운영 주체의 신원을 대신하지 않습니다.
      data:
        title: 신청 정보
        body: 양식에는 이름, 이메일, 국가 코드가 포함된 전화번호, 상호, 업종, 지점 수를 입력합니다. 메시지는 선택 사항입니다. 신청 언어와 동의 시간이 기록됩니다. 메시지에 비밀번호,
          은행 정보 또는 민감한 정보를 입력하지 마세요.
      purposes:
        title: 이용 목적
        body: 담당 팀은 신청 정보를 통해 후속 연락, 질문 답변 및 시연 일정을 조율합니다. 시스템은 해당 신청에 관한 확인, 일정 변경 및 알림 이메일을 보낼 수 있습니다. 이 양식에는
          광고 구독이 포함되지 않습니다.
      handling:
        title: 접근 및 보관
        body: 제출된 정보는 시스템에 저장되며 관리자 신청 모듈에서 조회됩니다. 이메일 발송에는 운영자가 설정한 서비스가 사용됩니다. 수신자, 제공업체, 정보 이전 가능성 및 보관 기간은 확인이
          필요하며 이 초안에는 아직 명시되어 있지 않습니다.
      rights:
        title: 이용자의 선택 및 요청
        body: 위 개인정보 문의 창구가 활성화되면 정보 열람, 수정, 삭제, 처리 반대 또는 동의 철회를 요청할 수 있습니다. 검토할 신청을 명시하고 확인되지 않은 경로로 민감한 서류를 보내지
          마세요. 운영자는 적용되는 처리 절차를 정하고 안내해야 합니다.
      cookies:
        title: 브라우저 설정
        body: 시스템은 세션과 브라우저 언어 설정을 사용합니다. 양식에서 언어를 변경할 때 같은 절차를 이어갈 수 있도록 입력값을 메모리에 일시 보관하며 브라우저 로컬 저장소에는 저장하지 않습니다.
          새로고침하거나 페이지를 닫으면 제출하지 않은 정보가 사라질 수 있습니다.
      changes:
        title: 문서 변경
        body: 현재 버전과 변경 사항은 이 페이지에 게시됩니다. 신청을 제출하기 전에 버전 날짜와 운영 주체 정보를 확인하세요.
    contact_name: 담당자
    provisional_email: 예시 이메일입니다. 요청을 수신할 수 없습니다.
