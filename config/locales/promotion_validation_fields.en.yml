        starts_at: "Start date and time"
        ends_at: "End date and time"
        usage_limit: "Total usage limit"
        customer_limit: "Per-customer limit"
        maximum_discount: "Maximum line discount"
        priority: "Priority"
        combination_mode: "Promotion combination"
        promotion_benefits: "Benefits"
        promotion_conditions: "Conditions"
