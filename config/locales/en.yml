      cash_register: { title: "Cash register and shifts", description: "Open and close shifts, record withdrawals, and detect differences at the end of the day." }
      users: { title: "Users and permissions", description: "Define roles for cashiers, supervisors, and administrators with the permissions each needs." }
      returns: { title: "Returns", description: "Process returns and cancellations while keeping inventory and cash balanced." }
