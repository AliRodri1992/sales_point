      install: { question: "Do I need to install anything on my computer?", answer: "No. Nexo POS runs in your browser, so you can use it on any computer with internet access." }
      offline: { question: "Can I keep selling if the internet goes down?", answer: "Yes. The point of sale stores operations locally and syncs them when the connection returns." }
      migration: { question: "Can I migrate my product catalog?", answer: "You can import products from an Excel or CSV file, and we will guide you through the first upload." }
