ko:
  admin:
    user_manual:
      sections:
        startup:
          title: "초기 설정 및 지점"
          description: "회사 설정, 초기 등록, 지점, 대시보드와 사용자 환경설정을 관리합니다."
          topics:
            -
              id: "onboarding"
              title: "초기 설정"
              description: "조직을 준비하는 5단계 설정 마법사입니다."
              before: "조직과 관리자 계정이 필요합니다."
              tasks:
                -
                  title: "설정 마법사 완료"
                  steps:
                    - "관리자 계정으로 로그인하고 초기 설정이 완료되지 않았다면 '초기 설정'을 엽니다."
                    - "1단계: 회사명, RFC, 업종, 기본 통화 및 시간대를 확인하고 저장한 뒤 다음 단계로 이동합니다."
                    - "2단계: 기본 지점, 전화번호, 주소를 등록하고 국가와 우편번호를 확인합니다."
                    - "3단계: 다른 단말기와 구분할 수 있도록 첫 번째 단말기 또는 계산대의 이름을 지정합니다."
                    - "4단계: 설정 마법사에서 요청하는 결제 수단을 선택합니다."
                    - "5단계: 요약을 검토하고 완료하면 기본 대시보드로 돌아갑니다."
                  result: "조직 설정과 진행 상황이 저장됩니다."
                -
                  title: "업무 시작 준비"
                  steps:
                    - "상단 탐색 표시줄에서 현재 활성 지점을 확인합니다."
                    - "상품을 분류할 수 있도록 카테고리를 먼저 만들고 상품을 등록합니다."
                    - "공급업체를 등록하고 상품 제안을 연결한 뒤 거래 조건을 설정합니다."
                    - "구매, 재고, 재무를 담당하는 직원의 역할과 권한을 설정합니다."
              note: "설정을 완료하면 마법사가 닫힙니다. 이후에는 해당 모듈에서 정보를 관리할 수 있습니다."
            -
              id: "dashboard"
              title: "대시보드와 위젯"
              description: "지표를 확인하고 작업 공간을 개인화합니다."
              tasks:
                -
                  title: "대시보드 보기"
                  steps:
                    - "사이드바에서 '대시보드'를 엽니다."
                    - "지표와 아직 완료되지 않은 초기 설정 카드를 확인합니다."
                    - "의사 결정 전에 원본 모듈을 열어 정보를 검증합니다."
                -
                  title: "위젯 정리"
                  steps:
                    - "이동이나 크기 변경을 지원하는 위젯을 조정합니다."
                    - "해당 옵션이 있으면 배치를 확인하거나 저장합니다."
                    - "대시보드로 돌아가 개인 설정이 유지되는지 확인합니다."
              note: "표시되는 위젯은 설치된 버전에 따라 달라집니다."
            -
              id: "profile"
              title: "내 프로필 및 환경설정"
              description: "계정 권한을 변경하지 않고 개인 정보를 수정합니다."
              tasks:
                -
                  title: "프로필 수정"
                  steps:
                    - "아바타 옆의 사용자 메뉴에서 '내 프로필'을 선택합니다."
                    - "사용자 이름, 이메일, 언어 및 화면 테마를 확인합니다."
                    - "필요한 내용을 수정하고 '저장'을 선택합니다."
                    - "확인 메시지를 확인하고 프로필을 다시 열어 변경 사항을 검증합니다."
                -
                  title: "언어 변경"
                  steps:
                    - "'내 프로필'에서 지원되는 스페인어, 영어 또는 한국어를 선택합니다."
                    - "저장한 뒤 다음 화면의 텍스트를 확인합니다."
              note: "역할과 권한은 별도로 관리됩니다. 프로필을 수정해도 추가 접근 권한은 부여되지 않습니다."
            -
              id: "branches"
              title: "지점과 활성 지점 선택"
              description: "업무 장소를 만들고 거래가 기록될 지점을 선택합니다."
              tasks:
                -
                  title: "지점 생성"
                  steps:
                    - "'설정' → '지점'에서 '새 지점'을 선택합니다."
                    - "지점명, 전화번호, 주소를 입력하고 해당 국가를 선택합니다."
                    - "필수 항목을 입력하고 상태를 검토합니다."
                    - "저장한 뒤 목록에서 지점을 찾습니다."
                -
                  title: "지점 수정 또는 삭제"
                  steps:
                    - "지점을 찾고 작업 메뉴를 엽니다."
                    - "'수정'을 선택해 내용을 변경한 뒤 저장합니다."
                    - "비활성화하려면 '삭제'를 선택하고 확인합니다. 데이터는 물리적으로 삭제되지 않고 논리 삭제됩니다."
                -
                  title: "활성 지점 변경"
                  steps:
                    - "인터페이스의 지점 선택 메뉴를 엽니다."
                    - "활성 지점을 선택하고 확인합니다."
                    - "재고를 조회하기 전에 올바른 지점이 활성화되어 있는지 확인합니다."
              note: "재고와 여러 업무는 선택한 지점에 따라 달라집니다."
            -
              id: "organization_contacts"
              title: "조직 연락처"
              description: "사업체의 공식 연락처를 관리합니다."
              before: "관리자 접근 권한과 활성 조직이 필요합니다."
              tasks:
                -
                  title: "연락처 등록 또는 수정"
                  steps:
                    - "관리 메뉴에서 '조직 연락처'를 엽니다."
                    - "'새 연락처'를 선택하고 요청된 항목을 입력합니다."
                    - "저장한 뒤 연락처가 목록에 표시되는지 확인합니다."
                    - "수정하려면 해당 연락처의 '수정'을 선택하고 저장합니다."
                -
                  title: "연락처 삭제"
                  steps:
                    - "더 이상 사용하지 않을 연락처를 찾습니다."
                    - "삭제 작업을 선택하고 페이지를 나가기 전에 확인합니다."
        security:
          title: "사용자, 역할 및 권한"
          description: "사용자를 등록하고 역할, 접근 권한, 언어 설정을 관리합니다."
          topics:
            -
              id: "users"
              title: "사용자 관리"
              description: "계정을 만들고 사용자 정보 또는 상태를 수정합니다."
              before: "관리 권한이 있는 역할이 필요합니다."
              tasks:
                -
                  title: "사용자 등록"
                  steps:
                    - "'설정' → '사용자'에서 '새 사용자'를 선택합니다."
                    - "사용자 이름, 이메일, 사용자 유형 및 양식에 필요한 접근 설정을 입력합니다."
                    - "사용 가능한 역할 또는 권한을 지정하고 초기 상태를 확인합니다."
                    - "저장한 다음 목록에서 해당 사용자를 찾아 등록 여부를 확인합니다."
                -
                  title: "사용자 수정"
                  steps:
                    - "표에서 이름 또는 이메일로 사용자를 찾습니다."
                    - "'보기' 또는 '수정'을 선택해 허용된 정보를 변경합니다."
                    - "저장하고 확인 메시지를 검토합니다."
                -
                  title: "사용자 삭제"
                  steps:
                    - "정확한 계정을 선택했는지 확인한 뒤 '삭제'를 선택합니다."
                    - "작업을 확인하고 갱신된 목록을 검토합니다."
                    - "이 작업으로 자신의 계정을 삭제할 수 없습니다. 허가된 관리 절차를 이용하세요."
              note: "삭제는 논리 삭제로 처리됩니다. 여러 사람이 동일한 계정을 공유하지 마세요."
            -
              id: "roles"
              title: "역할과 권한"
              description: "담당 업무에 필요한 최소 권한만 부여합니다."
              tasks:
                -
                  title: "역할 생성 또는 수정"
                  steps:
                    - "'설정' → '역할 및 권한'을 엽니다."
                    - "기존 역할을 선택하거나 이름과 코드를 입력해 새 역할을 만듭니다."
                    - "모듈별 조회, 생성, 수정, 보관, 내보내기 및 금융 작업 등 제공되는 권한을 확인합니다."
                    - "저장한 뒤 해당 역할이 지정된 사용자로 결과를 확인합니다."
                -
                  title: "접근 거부 해결"
                  steps:
                    - "사용자가 수행할 수 없는 작업을 파악합니다."
                    - "현재 조직과 역할 및 해당 작업의 권한을 확인합니다."
                    - "업무상 필요한 경우에만 적절한 권한을 부여합니다."
                    - "사용자에게 모듈을 다시 열어 접근이 가능한지 확인하도록 요청합니다."
              note: "버튼을 숨기는 것만으로 서버의 권한 검증을 대신할 수는 없습니다. 두 방식 모두 필요합니다."
            -
              id: "languages"
              title: "언어 카탈로그"
              description: "시스템에 표시되는 언어 옵션을 관리합니다."
              tasks:
                -
                  title: "언어 추가"
                  steps:
                    - "'카탈로그' → '언어'를 엽니다."
                    - "'새 언어'를 선택하고 이름, 코드, ISO 국기 및 상태를 입력합니다."
                    - "저장한 뒤 목록에 표시되는지 확인합니다."
                -
                  title: "언어 수정 또는 비활성화"
                  steps:
                    - "검색이나 필터로 언어를 찾습니다."
                    - "'수정'을 선택해 정보를 변경하고 저장합니다."
                    - "더 이상 제공하지 않을 언어는 '삭제'를 이용해 보관 처리합니다."
              note: "카탈로그에 언어를 추가해도 모든 화면이 자동 번역되거나 번역 파일이 생성되지는 않습니다."
        catalogs:
          title: "카탈로그, 재고 및 고객"
          description: "상품 분류, 상품, 지점별 재고 및 고객 정보를 관리합니다."
          topics: []
        suppliers:
          title: "공급업체 및 상세 정보"
          description: "공급업체와 담당자, 주소, 상품 제안, 문서 및 일정을 관리합니다."
          topics: []
        purchasing:
          title: "구매 및 입고"
          description: "구매 요청, 견적, 발주, 입고 및 반품을 관리합니다."
          topics:
            -
              id: "purchase_requests"
              title: "구매 요청"
              description: "지점에서 구매해야 할 상품을 지정합니다."
              tasks:
                -
                  title: "요청 생성"
                  steps:
                    - "'구매 요청'을 열고 '새 요청'을 선택합니다."
                    - "지점, 필요 날짜 및 메모를 선택합니다."
                    - "상품과 수량을 각각 추가하고 누락된 항목이 없는지 확인합니다."
                    - "초안으로 저장한 뒤 상세 내용을 검토합니다."
                -
                  title: "제출 및 승인 결정"
                  steps:
                    - "초안을 열고 '제출'을 선택합니다."
                    - "권한이 있는 사용자가 상세 내용을 검토하고 '승인' 또는 '거절'을 선택합니다."
                    - "더 이상 필요하지 않은 초안은 '취소'를 선택합니다."
                    - "견적을 시작하기 전에 현재 상태를 확인합니다."
              note: "구매 요청이 승인되었다고 해서 상품이 입고되거나 채무가 결제된 것은 아닙니다."
            -
              id: "purchase_quotations"
              title: "구매 견적"
              description: "공급업체의 제안을 등록하고 유효기간을 확인합니다."
              tasks:
                -
                  title: "견적 생성"
                  steps:
                    - "'구매 견적'에서 '새 견적'을 선택하거나 구매 요청에서 시작합니다."
                    - "공급업체, 통화, 유효기간 및 메모를 입력합니다."
                    - "상품, 수량, 포장 단위, 비용, 할인 및 배송 소요일을 추가합니다."
                    - "초안을 저장하고 모든 정보를 확인합니다."
                -
                  title: "제출, 수락 또는 거절"
                  steps:
                    - "견적 초안을 열고 '제출'을 선택합니다."
                    - "공급업체가 확인하면 해당 상황에 따라 '수락' 또는 '거절'을 선택합니다."
                    - "수락하기 전에 제안이 만료되지 않았는지 확인합니다."
                    - "제출된 견적은 초안처럼 수정할 수 없습니다."
              note: "수락된 견적을 이용해 구매 주문서를 만들 수 있습니다."
            -
              id: "purchase_orders"
              title: "구매 주문서"
              description: "주문을 확정하고 승인 및 발송 상태를 관리합니다."
              tasks:
                -
                  title: "주문서 생성"
                  steps:
                    - "'구매 주문서'에서 '새 주문서'를 선택하거나 수락된 견적에서 시작합니다."
                    - "지점, 공급업체, 통화 및 예상 배송일을 입력합니다."
                    - "상품과 수량, 단가, 할인, 운송비, 보험 및 해당 세금을 추가합니다."
                    - "초안으로 저장하고 계산된 합계를 확인합니다."
                -
                  title: "승인 후 공급업체에 발송"
                  steps:
                    - "상세 화면에서 '제출'을 선택해 승인을 요청합니다."
                    - "권한 있는 담당자가 '승인' 또는 '거절'을 선택합니다."
                    - "주문이 승인되고 공급업체가 거래 가능한 상태이면 '주문서 발송' 또는 발송 작업을 선택합니다."
                    - "입고를 기록하기 전에 주문 상태를 확인합니다."
                -
                  title: "주문 취소 또는 종료"
                  steps:
                    - "상세 화면에서 현재 상태와 관련 납품 내역을 확인합니다."
                    - "현재 진행 단계에서 허용되는 경우에만 '취소'를 선택합니다."
                    - "모든 의무가 해결되면 적용되는 규칙에 따라 '종료'를 선택합니다."
              note: "공급업체가 비활성화되거나 보관되면 새 주문 및 발송이 제한될 수 있지만 과거 의무는 계속 처리해야 합니다."
            -
              id: "goods_receipts"
              title: "상품 입고"
              description: "실제로 도착한 수량을 확인합니다."
              tasks:
                -
                  title: "입고 등록"
                  steps:
                    - "입고할 수 있는 구매 주문서를 열고 '입고'를 선택합니다."
                    - "'새 입고'를 선택하고 지점, 미입고 상품, 주문 수량을 확인합니다."
                    - "실제 입고 수량을 입력하고 상품에 필요한 경우 로트 정보를 기록합니다."
                    - "저장한 뒤 입고 증빙을 엽니다."
                    - "해당 지점의 재고 이동 내역을 확인합니다."
              note: "부분 입고가 발생해도 주문서의 모든 미처리 항목이 자동으로 종료되지는 않습니다."
            -
              id: "purchase_returns"
              title: "공급업체 반품"
              description: "추적 기록을 유지하며 입고된 상품을 반품합니다."
              tasks:
                -
                  title: "반품 생성"
                  steps:
                    - "원본 상품 입고 기록을 엽니다."
                    - "'새 반품'을 선택하고 해당 상품과 수량을 지정합니다."
                    - "요청되는 경우 반품 사유와 비고를 입력합니다."
