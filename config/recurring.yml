production:
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12

  accounts_payable_reminders:
    class: AccountsPayableReminderJob
    # 14:00 UTC = 08:00 America/Mexico_City (the financial team's daily review)
    schedule: "0 14 * * *"

