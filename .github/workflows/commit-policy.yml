name: Minimum commit files

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  commit-policy:
    name: Verify minimum five changed files per commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Test commit policy verifier
        run: bash test/commit_min_files_test.sh

      - name: Check all newly pushed commits
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          if [[ "$BEFORE" =~ ^0+$ ]] || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            bash bin/check-commit-min-files --commit "$AFTER"
          else
            bash bin/check-commit-min-files --range "$BEFORE" "$AFTER"
          fi

      - name: Check pull request's head commit
        if: github.event_name == 'pull_request'
        env:
          HEAD_COMMIT: ${{ github.event.pull_request.head.sha }}
        run: bash bin/check-commit-min-files --commit "$HEAD_COMMIT"
