name: Generate Yarn Lock

on:
  push:
    branches:
      - feature/register

permissions:
  contents: write

jobs:
  lock:
    if: github.event.head_commit.message != 'Generate yarn.lock for font dependencies'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --mode=skip-builds
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add yarn.lock
          git diff --cached --quiet && exit 0
          git commit -m "Generate yarn.lock for font dependencies"
          git push
