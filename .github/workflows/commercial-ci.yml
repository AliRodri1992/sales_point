name: Commercial CI

on:
  workflow_dispatch:
  push:
    branches:
      - feature/fixes
    paths:
      - '.github/workflows/commercial-ci.yml'
      - 'app/controllers/admin/commercial_catalog_controller.rb'
      - 'app/controllers/admin/price_lists_controller.rb'
      - 'app/controllers/admin/promotions_controller.rb'
      - 'app/controllers/concerns/admin/commercial_lookups.rb'
      - 'app/models/price_list*.rb'
      - 'app/models/promotion*.rb'
      - 'app/models/concerns/commercial_*.rb'
      - 'app/policies/commercial_policy.rb'
      - 'app/policies/price_list_policy.rb'
      - 'app/policies/promotion_policy.rb'
      - 'app/queries/commercial_*.rb'
      - 'app/services/commercial*/**'
      - 'app/services/commercial*.rb'
      - 'app/services/products/**'
      - 'app/services/granular_permission_catalog.rb'
      - 'app/views/admin/price_lists/**'
      - 'app/views/admin/promotions/**'
      - 'app/views/admin/shared/_commercial*'
      - 'app/javascript/controllers/commercial_*'
      - 'app/javascript/controllers/price_list_*'
      - 'app/javascript/controllers/promotion_*'
      - 'app/helpers/commercial_breadcrumbs_helper.rb'
      - 'app/helpers/price_lists_helper.rb'
      - 'app/helpers/promotions_helper.rb'
      - 'config/locales/commercial_*'
      - 'config/locales/price_lists.*.yml'
      - 'config/locales/promotions.*.yml'
      - 'config/routes.rb'
      - 'db/migrate/*commercial*'
      - 'db/schema.rb'
      - 'db/seeds.rb'
      - 'db/seeds/commercial_examples.rb'
      - 'spec/**/*commercial*'
      - 'spec/**/*price_list*'
      - 'spec/**/*promotion*'
      - 'spec/**/*product_price_history*'

permissions:
  contents: read

env:
  RAILS_ENV: test
  POSTGRES_DB_TEST: sale_point_test
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres
  POSTGRES_HOST: localhost
  POSTGRES_PORT: 5432
  REDIS_URL: redis://localhost:6379/0

jobs:
  commercial_specs:
    name: Commercial requests, rules, lifecycle and browser
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: sale_point_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d sale_point_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libpq-dev libvips
      - name: Install matching Chrome and ChromeDriver
        id: browser
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable
          install-chromedriver: true
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn
      - run: yarn install --frozen-lockfile
      - name: Build assets
        run: |
          yarn build:js
          yarn build:css
      - name: Fresh migrations
        run: bin/rails db:drop db:create db:migrate
      - name: Verify commercial models, tenant permissions, requests and transactions
        id: rules
        run: |
          bundle exec rspec \
            spec/models/commercial_lifecycle_spec.rb spec/policies/commercial_policy_spec.rb \
            spec/services/commercial spec/services/commercial_permission_catalog_spec.rb \
            spec/services/products/commercial*spec.rb spec/services/products/promotion*spec.rb \
            spec/services/products/price_list_retirement_spec.rb \
            spec/requests/admin/commercial_catalog_spec.rb spec/requests/admin/commercial_security_spec.rb \
            spec/requests/admin/commercial_workflows_spec.rb spec/requests/admin/product_commercial_access_spec.rb \
            spec/requests/admin/product_price_history_spec.rb spec/requests/admin/sidebar_spec.rb \
            spec/requests/admin/sidebar_icons_spec.rb spec/helpers/breadcrumbs_helper_spec.rb \
            spec/seeds/commercial_examples_spec.rb
      - name: Verify the new commercial browser workflows
        if: ${{ !cancelled() && (steps.rules.outcome == 'success' || steps.rules.outcome == 'failure') }}
        env:
          CHROME_BINARY: ${{ steps.browser.outputs.chrome-path }}
          CHROMEDRIVER_PATH: ${{ steps.browser.outputs.chromedriver-path }}
        run: |
          bundle exec rspec spec/features/price_lists_workspace_browser_spec.rb \
            spec/features/promotion_campaigns_browser_spec.rb spec/features/commercial_preview_browser_spec.rb \
            spec/features/admin_sidebar_navigation_spec.rb
