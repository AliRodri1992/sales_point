name: Email Templates CI

on:
  workflow_dispatch:
  push:
    branches:
      - feature/fixes
    paths:
      - '.github/workflows/email-templates-ci.yml'
      - 'app/controllers/admin/email_*'
      - 'app/controllers/concerns/email_template*'
      - 'app/controllers/concerns/admin/email_template*'
      - 'app/models/email_template*'
      - 'app/models/email_sender_setting.rb'
      - 'app/models/email_branding_setting.rb'
      - 'app/services/email_templates/**'
      - 'app/jobs/email_templates/**'
      - 'app/mailers/email_templates/**'
      - 'app/mailers/email_template_test_mailer.rb'
      - 'app/mailers/user_invitation_mailer.rb'
      - 'app/views/admin/email_templates/**'
      - 'app/views/admin/email_sender_settings/**'
      - 'app/views/admin/email_branding_settings/**'
      - 'app/views/admin/email_setting_audits/**'
      - 'app/javascript/controllers/index.js'
      - 'app/javascript/controllers/email_template*'
      - 'config/locales/email_templates.*.yml'
      - 'spec/**/email_template*'
      - 'spec/**/email_sender*'
      - 'spec/**/email_branding*'
      - 'spec/**/email_setting*'

permissions:
  contents: read

env:
  RAILS_ENV: test
  POSTGRES_DB_TEST: sale_point_test
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres
  POSTGRES_HOST: localhost
  POSTGRES_PORT: 5432
  REDIS_URL: redis://localhost:6379/0

jobs:
  email_lint:
    name: Email module RuboCop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libpq-dev
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version-file: .ruby-version
          bundler-cache: true
      - name: Lint email modules and regression specs
        run: |
          bin/rubocop -f simple \
            app/controllers/admin/email_templates_controller.rb \
            app/controllers/admin/email_branding_settings_controller.rb \
            app/controllers/admin/email_sender_settings_controller.rb \
            app/controllers/concerns/email_template* \
            app/controllers/concerns/admin/email_template* \
            app/models/email_template* app/models/email_sender_setting.rb \
            app/models/email_branding_setting.rb app/services/email_templates \
            app/jobs/email_templates app/mailers/email_templates \
            app/mailers/email_template_test_mailer.rb \
            spec/models/email_template* spec/models/email_sender_setting_spec.rb \
            spec/models/email_branding_setting_spec.rb \
            spec/services/email_templates spec/jobs/email_templates \
            spec/mailers/email_template_delivery_spec.rb \
            spec/requests/admin/email_templates_spec.rb \
            spec/requests/admin/email_template_activity_spec.rb \
            spec/requests/admin/email_setting_audits_spec.rb \
            spec/features/email_template* spec/features/email_sender_settings_browser_spec.rb

  email_specs:
    name: Email module RSpec and browser flows
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: sale_point_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d sale_point_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libpq-dev libvips
      - name: Install matching Chrome and ChromeDriver
        id: browser
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable
          install-chromedriver: true
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version-file: .ruby-version
          bundler-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn
      - run: yarn install --frozen-lockfile
      - name: Build assets
        run: |
          yarn build:js
          yarn build:css
      - name: Create test database and run migrations without demo seeds
        run: bin/rails db:create db:migrate
      - name: Run email models, requests, mailers, services and browser regressions
        env:
          CHROME_BINARY: ${{ steps.browser.outputs.chrome-path }}
          CHROMEDRIVER_PATH: ${{ steps.browser.outputs.chromedriver-path }}
        run: |
          bundle exec rspec \
            spec/models/email_template* spec/models/email_sender_setting_spec.rb \
            spec/models/email_branding_setting_spec.rb \
            spec/models/email_templates spec/services/email_templates \
            spec/jobs/email_templates spec/mailers/email_template_delivery_spec.rb \
            spec/mailers/user_invitation_mailer_spec.rb \
            spec/policies/email_template_policy_spec.rb \
            spec/policies/email_setting_policies_spec.rb \
            spec/queries/email_templates_query_spec.rb \
            spec/notifications/email_template_notification_spec.rb \
            spec/requests/admin/email_templates_spec.rb \
            spec/requests/admin/email_template_activity_spec.rb \
            spec/requests/admin/email_setting_audits_spec.rb \
            spec/features/email_template* spec/features/email_sender_settings_browser_spec.rb
