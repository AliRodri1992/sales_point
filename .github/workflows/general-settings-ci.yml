name: General Settings CI

on:
  workflow_dispatch:
  push:
    branches:
      - feature/fixes
    paths:
      - '.github/workflows/general-settings-ci.yml'
      - 'app/controllers/admin/general_settings_controller.rb'
      - 'app/controllers/admin/table_page_preferences_controller.rb'
      - 'app/controllers/concerns/table_page_sizing.rb'
      - 'app/models/organization_setting.rb'
      - 'app/models/general_setting_audit_event.rb'
      - 'app/models/table_page_preference.rb'
      - 'app/views/admin/general_settings/**'
      - 'app/javascript/controllers/general_settings_preview_controller.js'
      - 'config/locales/breadcrumbs_controllers.*.yml'
      - 'config/locales/table_page_preferences.*.yml'
      - 'db/migrate/*general_setting_audit*'
      - 'spec/requests/admin/general_settings_spec.rb'
      - 'spec/requests/admin/table_page_preferences_spec.rb'
      - 'spec/models/organization_setting_spec.rb'
      - 'spec/models/general_setting_audit_event_spec.rb'
      - 'spec/features/general_settings_browser_spec.rb'

permissions:
  contents: read

env:
  RAILS_ENV: test
  POSTGRES_DB_TEST: sale_point_test
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres
  POSTGRES_HOST: localhost
  POSTGRES_PORT: 5432
  REDIS_URL: redis://localhost:6379/0

jobs:
  general_lint:
    name: General module RuboCop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libpq-dev
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version-file: .ruby-version
          bundler-cache: true
      - name: Lint general settings and table preference contract
        run: |
          bin/rubocop -f simple \
            app/controllers/admin/general_settings_controller.rb \
            app/controllers/admin/table_page_preferences_controller.rb \
            app/controllers/concerns/table_page_sizing.rb \
            app/models/organization_setting.rb app/models/general_setting_audit_event.rb \
            app/models/table_page_preference.rb \
            spec/requests/admin/general_settings_spec.rb \
            spec/requests/admin/table_page_preferences_spec.rb \
            spec/models/organization_setting_spec.rb \
            spec/models/general_setting_audit_event_spec.rb \
            spec/features/general_settings_browser_spec.rb

  general_locales:
    name: General translations and YAML integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install YAML parser
        run: python -m pip install --disable-pip-version-check PyYAML
      - name: Audit all locale files and translation parity
        run: I18N_STRICT_PARITY=1 python script/audit_i18n.py

  general_specs:
    name: General model request and browser regressions
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: sale_point_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d sale_point_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libpq-dev libvips
      - name: Install matching Chrome and ChromeDriver
        id: browser
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable
          install-chromedriver: true
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version-file: .ruby-version
          bundler-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn
      - run: yarn install --frozen-lockfile
      - name: Build assets
        run: |
          yarn build:js
          yarn build:css
      - name: Prepare test database with a fresh migration run
        run: bin/rails db:create db:migrate
      - name: Run general settings and preference regressions
        env:
          CHROME_BINARY: ${{ steps.browser.outputs.chrome-path }}
          CHROMEDRIVER_PATH: ${{ steps.browser.outputs.chromedriver-path }}
        run: |
          bundle exec rspec \
            spec/requests/admin/general_settings_spec.rb \
            spec/requests/admin/table_page_preferences_spec.rb \
            spec/models/organization_setting_spec.rb \
            spec/models/general_setting_audit_event_spec.rb \
            spec/features/general_settings_browser_spec.rb
