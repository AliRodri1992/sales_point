name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - development
      - master
      - staging
      - test
      - feature/register
      - feature/suppliers

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  RAILS_ENV: test
  POSTGRES_DB_TEST: sale_point_test
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres
  POSTGRES_HOST: localhost
  POSTGRES_PORT: 5432
  REDIS_URL: redis://localhost:6379/0

jobs:
  security:
    name: Security scans
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libpq-dev

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version-file: .ruby-version
          bundler-cache: true

      - name: Scan Rails code
        run: bin/brakeman --no-pager

      - name: Scan gem dependencies
        run: bin/bundler-audit check --update

  lint:
    name: RuboCop
    runs-on: ubuntu-latest
    env:
      RUBOCOP_CACHE_ROOT: tmp/rubocop

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libpq-dev

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version-file: .ruby-version
          bundler-cache: true

      - name: Cache RuboCop
        uses: actions/cache@v4
        with:
          path: tmp/rubocop
          key: rubocop-${{ runner.os }}-${{ hashFiles('.ruby-version', '.rubocop.yml', 'Gemfile.lock') }}
          restore-keys: |
            rubocop-${{ runner.os }}-

      - name: Lint Ruby code
        run: bin/rubocop -f github -f simple

  test:
    name: RSpec
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: sale_point_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d sale_point_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libpq-dev libvips

      - name: Install matching Chrome and ChromeDriver
        id: browser
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable
          install-chromedriver: true

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version-file: .ruby-version
          bundler-cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: Install JavaScript dependencies
        run: yarn install --frozen-lockfile

      - name: Build assets
        run: |
          yarn build:js
          yarn build:css

      - name: Prepare test database
        run: bin/rails db:prepare

      - name: Export generated schema for synchronization
        run: |
          echo "__SCHEMA_START__"
          base64 -w0 db/schema.rb
          echo
          echo "__SCHEMA_END__"

      - name: Run focused supplier branch-coverage regressions
        env:
          CHROME_BINARY: ${{ steps.browser.outputs.chrome-path }}
          CHROMEDRIVER_PATH: ${{ steps.browser.outputs.chromedriver-path }}
        run: |
          bundle exec rspec spec/models/supplier_bank_account_spec.rb spec/services/suppliers/dossier_bank_accounts_page_spec.rb spec/requests/admin/supplier_postal_codes_spec.rb spec/requests/admin/supplier_documents_spec.rb spec/models/supplier_invoice_receipt_spec.rb spec/requests/admin/organization_contacts_spec.rb

      - name: Run focused branded dropdown browser regressions
        env:
          CHROME_BINARY: ${{ steps.browser.outputs.chrome-path }}
          CHROMEDRIVER_PATH: ${{ steps.browser.outputs.chromedriver-path }}
        run: |
          bundle exec rspec spec/features/supplier_dropdown_hover_spec.rb spec/features/supplier_calendar_browser_spec.rb spec/features/supplier_address_browser_spec.rb

      - name: Run focused sidebar and supplier validation browser regressions
        env:
          CHROME_BINARY: ${{ steps.browser.outputs.chrome-path }}
          CHROMEDRIVER_PATH: ${{ steps.browser.outputs.chromedriver-path }}
        run: |
          bundle exec rspec spec/features/admin_sidebar_navigation_spec.rb spec/features/admin_sidebar_interactions_spec.rb spec/features/supplier_creation_summary_spec.rb

      - name: Run RSpec
        env:
          COVERAGE: true
          CHROME_BINARY: ${{ steps.browser.outputs.chrome-path }}
          CHROMEDRIVER_PATH: ${{ steps.browser.outputs.chromedriver-path }}
        run: bundle exec rspec

      - name: Report coverage gaps
        if: always()
        run: ruby script/report_coverage_gaps.rb

  i18n:
    name: Rails I18n and YAML audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version-file: .ruby-version
          bundler-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install YAML parser
        run: python -m pip install --disable-pip-version-check PyYAML

      - name: Audit locale YAML files
        run: python script/audit_i18n.py

      - name: Validate Rails I18n loading
        run: |
          bin/rails runner 'I18n.available_locales.each { |locale| I18n.backend.send(:init_translations); I18n.backend.send(:translations)[locale] }'
