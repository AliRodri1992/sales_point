name: Pre-push hook tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pre-push-hook-tests:
    name: Validate Docker-only RSpec pre-push hook
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Test Docker-only RSpec pre-push hook without Docker daemon
        run: bash test/overcommit_rspec_test.sh
