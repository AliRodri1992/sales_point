name: Hook configuration

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  hook-configuration:
    name: Verify fast local hooks and CI test enforcement
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify local hooks and full CI coverage
        run: ruby test/overcommit_configuration_test.rb

      - name: Preserve isolated RSpec runner regression tests
        run: bash test/overcommit_rspec_test.sh
